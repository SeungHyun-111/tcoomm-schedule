<script>
// 번들보다 먼저 실행: 번들 자체의 구문 오류도 기록합니다.
(function () {
  var sources = {};
  var reports = [];
  var stage = 'diagnostics-ready';
  var activeSource = '';
  function report(kind, details) {
    details = details || {};
    var stackLocation = String(details.stack || '').match(/((?:msm-dashboard|pgmdr-competitor|access-management|access-logs|full-list)\.bundle\.js):(\d+):(\d+)/);
    var filename = details.filename || (stackLocation ? stackLocation[1] : '');
    var browserFilename = filename;
    var inferredSource = !sources[filename] && !!activeSource && kind === 'javascript';
    if (!sources[filename] && activeSource && (kind === 'javascript')) filename = activeSource;
    var line = Number(details.line || (stackLocation ? stackLocation[2] : 0));
    var source = sources[filename];
    var context = '';
    if (source && line > 0) {
      var lines = source.split('\n');
      var start = Math.max(0, line - 4);
      var end = Math.min(lines.length, line + 3);
      context = lines.slice(start, end).map(function (text, index) {
        var number = start + index + 1;
        return (number === line ? '> ' : '  ') + number + ': ' + text;
      }).join('\n');
    }
    var entry = {
      kind: kind, stage: stage, message: details.message || '알 수 없는 오류',
      filename: filename, browserFilename: browserFilename, inferredSource: inferredSource,
      line: line, column: Number(details.column || (stackLocation ? stackLocation[3] : 0)),
      stack: details.stack || '', context: context, time: new Date().toISOString()
    };
    reports.push(entry);
    if (reports.length > 30) reports.shift();
    console.error('[MSM ERROR] ' + kind + ' | ' + stage + '\n' + entry.message +
      '\n위치: ' + (filename || '(브라우저에서 제공하지 않음)') + ':' + entry.line + ':' + entry.column +
      (inferredSource ? '\n소스 후보: 실행 중 번들 기준. 브라우저 원본 파일명: ' + browserFilename : '') +
      '\n' + entry.stack + (context ? '\n주변 코드:\n' + context : ''), entry);
    var panel = document.getElementById('msm-diagnostic-error');
    if (!panel) {
      panel = document.createElement('pre');
      panel.id = 'msm-diagnostic-error';
      panel.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;color:#a52020;background:#fff0f0;font:13px/1.6 monospace';
      (document.body || document.documentElement).appendChild(panel);
    }
    panel.textContent = '[MSM ERROR] ' + kind + '\n단계: ' + stage + '\n' + entry.message +
      '\n위치: ' + filename + ':' + entry.line + ':' + entry.column + '\n' + entry.stack +
      (context ? '\n주변 코드:\n' + context : '') + '\n\n콘솔에서 [MSM ERROR] 로그를 확인하세요.';
    return entry;
  }
  window.__MSM_DIAGNOSTICS__ = {
    reports: reports,
    setSource: function (name, source) { sources[name] = source; activeSource = name; },
    stage: function (name) { stage = name; console.info('[MSM STAGE] ' + name); },
    report: report
  };
  window.addEventListener('error', function (event) {
    report('javascript', { message: event.message, filename: event.filename, line: event.lineno,
      column: event.colno, stack: event.error && event.error.stack });
  });
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    report('unhandledrejection', { message: reason && reason.message || String(reason), stack: reason && reason.stack });
  });
  console.info('[MSM STAGE] diagnostics-ready');
})();
</script>
